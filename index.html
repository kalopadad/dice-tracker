<style>
:root{
  --bg:#0a1a12; --panel:#12281c; --panel2:#17352500; --card:#143022; --line:#24503a;
  --ink:#eef6f0; --mut:#93b3a0; --acc:#f2c14e; --acc2:#3ddc97; --bad:#ff6b6b; --warn:#ffb454; --blue:#6cb6ff;
  --r:16px; --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body{min-height:100vh}
#app{padding:calc(10px + var(--safeT)) 12px calc(86px + var(--safeB));max-width:640px;margin:0 auto}
h1{font-size:22px;margin:4px 2px 10px;letter-spacing:.2px}
h2{font-size:15px;margin:18px 2px 8px;color:var(--acc);text-transform:uppercase;letter-spacing:.8px}
h3{font-size:14px;margin:0 0 6px;color:var(--ink)}
.mut{color:var(--mut)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:#0f2519;border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.tile .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.tile .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11px;color:var(--mut);margin-top:1px}
button,.btn{font:inherit;color:var(--ink);background:#1d4430;border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-height:44px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);color:#2a1f00;border-color:var(--acc);font-weight:700}
button.go{background:var(--acc2);color:#04281a;border-color:var(--acc2);font-weight:700}
button.dng{background:#4a1f24;border-color:#7a2c34;color:#ffd5d5}
button.ghost{background:transparent}
button.sm{padding:6px 10px;min-height:34px;font-size:14px;border-radius:10px}
button:disabled{opacity:.45}
input,select,textarea{font:inherit;color:var(--ink);background:#0d2016;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;color:var(--ink);font-size:15px}
.chk input{width:22px;height:22px;min-height:0;margin:1px 0 0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#08150eef;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;
  padding:6px 6px calc(6px + var(--safeB));z-index:20}
.tabs button{flex:1;background:transparent;border:0;border-radius:10px;padding:6px 2px;min-height:48px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:20px;line-height:1;font-weight:400}
.tabs button.on{color:var(--acc);background:#17301f}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#25503a;color:var(--ink);white-space:nowrap}
.pill.come{background:#2c4a7a;color:#dbe9ff}.pill.point{background:var(--acc);color:#2a1f00}
.pill.bad{background:#7a2c34;color:#ffe0e0}.pill.good{background:#1f6b45;color:#dfffee}.pill.warn{background:#7a5a1e;color:#fff1d2}
.bigrun{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--acc)}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/9;max-height:34vh}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .rec{position:absolute;top:8px;left:8px;background:#000a;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
.cam .rec i{width:9px;height:9px;border-radius:50%;background:#ff3b3b;display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pad button{padding:0;min-height:66px;font-size:28px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border-radius:14px}
.pad button small{font-size:10px;font-weight:600;letter-spacing:.3px;opacity:.85}
.pad button.on-ax{border-color:#2d7a55}.pad button.off-ax{border-color:#7a5a1e;background:#2a2a18}
.pad button.sel{background:var(--acc);color:#2a1f00;border-color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border-radius:10px;padding:5px 9px;background:#0f2519;border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums;text-align:center;min-width:46px}
.chip b{display:block;font-size:16px}.chip.seven{background:#5a2328;border-color:#8a3a42}.chip.made{background:#1d5a3b;border-color:#2e8a5c}.chip.point{background:#6a5316;border-color:#a68424}
.chip.craps{background:#33284f;border-color:#5b4a8a}.chip.nat{background:#173b5a;border-color:#2f6c9e}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:6px 4px;border-bottom:1px solid #1b3b2b;text-align:right}
tr.hl td{background:#2a2a16}tr.tap{cursor:pointer}
.bar{position:relative;height:8px;border-radius:4px;background:#0c1d14;min-width:50px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--acc2)}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--acc);border-radius:1px}
.up{color:var(--warn)}.dn{color:var(--blue)}.ok{color:var(--acc2)}.badc{color:var(--bad)}
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;padding:0 12px}
details>summary{list-style:none;padding:13px 0;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;color:var(--acc)}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";color:var(--mut)}details[open]>summary::after{content:"－"}
details>div{padding-bottom:12px}
.heat{display:grid;grid-template-columns:22px repeat(6,1fr);gap:3px;font-size:12px;text-align:center}
.heat div{padding:7px 0;border-radius:6px;background:#0f2519}.heat .h{background:transparent;color:var(--mut);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + var(--safeT));background:#000d;border:1px solid var(--line);padding:10px 16px;border-radius:999px;z-index:40;font-weight:600;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .bd{position:absolute;inset:0;background:#000a}
.modal .sheet{position:relative;background:#10261a;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 14px calc(16px + var(--safeB));width:100%;max-width:640px;max-height:90vh;overflow:auto}
.warnbox{background:#3a2b10;border:1px solid #7a5a1e;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.empty{padding:26px 10px;text-align:center;color:var(--mut)}
.runbars{display:flex;flex-wrap:wrap;gap:4px}.runbars span{background:#0f2519;border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:13px;font-variant-numeric:tabular-nums}
.runbars .lo{border-color:#7a2c34;color:#ffb3b3}.runbars .hi{border-color:#2e8a5c;color:#b8ffd9}
a{color:var(--blue)}
video.play{width:100%;border-radius:12px;background:#000;max-height:46vh}
.hide{display:none!important}
.cam.rv{aspect-ratio:auto;height:25vh;max-height:none}.cam.rv video{object-fit:contain;background:#000}
textarea{font:inherit;color:var(--ink);background:#0d2016;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.btn.go{background:var(--acc2);color:#04281a;border-color:var(--acc2);font-weight:700}.btn.pri{background:var(--acc);color:#2a1f00;border-color:var(--acc);font-weight:700}

</style>

<script>
/* Dice Tracker engine — pure logic, no DOM. Mirrors BoneTracker Extended 5.8 concepts.
   Face positions on a die, as seen by the shooter:
   0 Top, 1 Front (facing you), 2 Bottom, 3 Back (to wall) = ON-axis (they rotate into each other
   when a die pitches end-over-end);  4 Left, 5 Right = OFF-axis. */
(function (root) {
  'use strict';

  const POS = ['Top', 'Front', 'Bottom', 'Back', 'Left', 'Right'];
  const WAYS = { 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 7: 6, 8: 5, 9: 4, 10: 3, 11: 2, 12: 1 };
  const GROUPS = {
    Across: [4, 5, 6, 8, 9, 10],
    Inside: [5, 6, 8, 9],
    Outside: [4, 5, 9, 10],
    Even: [4, 6, 8, 10],
    Field: [2, 3, 4, 9, 10, 11, 12],
    Craps: [2, 3, 12],
    Horn: [2, 3, 11, 12],
    World: [2, 3, 7, 11, 12],
  };
  const BOX = [4, 5, 6, 8, 9, 10];
  const CRAP_NUMS = [2, 3, 11, 12];
  const RBS_MAX = 20; // histogram bucket 20 means "20 or more"

  // ---------- dice sets ----------
  function dieFaces(d) { return [d.top, d.front, 7 - d.top, 7 - d.front, d.left, 7 - d.left]; }

  function validateDie(d) {
    const v = [d.top, d.front, d.left];
    if (v.some(x => !Number.isInteger(x) || x < 1 || x > 6)) return 'Pick a number 1–6 for Top, Facing you and Left.';
    if (new Set(v).size < 3) return 'Top, Facing you and Left must be three different numbers.';
    if (v[0] + v[1] === 7 || v[0] + v[2] === 7 || v[1] + v[2] === 7)
      return 'Two of those are opposite faces (they add to 7). Pick three faces that meet at one corner.';
    return null;
  }
  function validateSet(s) {
    if (!s || !s.name || !String(s.name).trim()) return 'Give the set a name.';
    const a = validateDie(s.left); if (a) return 'Left die: ' + a;
    const b = validateDie(s.right); if (b) return 'Right die: ' + b;
    return null;
  }

  // ---------- one roll ----------
  function classify(set, l, r) {
    const lf = dieFaces(set.left), rf = dieFaces(set.right);
    const li = lf.indexOf(l), ri = rf.indexOf(r);
    const lOn = li < 4, rOn = ri < 4;
    const both = lOn && rOn;
    const diff = both ? (((ri - li) % 4) + 4) % 4 : -1;
    return {
      l, r, result: l + r, li, ri, lOn, rOn,
      bothOn: both,
      primary: both && diff === 0,          // both dice show the same position
      single: both && (diff === 1 || diff === 3), // one die a quarter-turn from the other
      dbl: both && diff === 2,              // one die a half-turn from the other
      loff: !lOn && rOn, roff: lOn && !rOn, boff: !lOn && !rOn,
      oneOff: lOn !== rOn,
      hard: l === r ? l + r : 0,
      poi: POS[li] + '-' + POS[ri],
      prime: !both ? 'X' : diff === 0 ? 'P' : 'S',
    };
  }

  // ---------- craps hands, come-out/point phase, rolls-before-seven runs ----------
  // rolls: [{l, r, brk?}]  brk=true means "a break happened before this roll" (new hand, new run).
  // opts.crapsEndsRun (default true): a come-out craps (2/3/12) also ends a run.
  function analyze(rolls, o) {
    const opt = Object.assign({ crapsEndsRun: true }, o || {});
    const ann = [], hands = [], runs = [], sevenRuns = [];
    let point = null;
    const newHand = (i) => ({ idx: hands.length + 1, start: i, rolls: 0, beforeSeven: 0, established: 0, made: 0, naturals: 0, craps: 0, ended: null });
    const newRun = (i) => ({ start: i, len: 0, ender: null, complete: false });
    const newSR = (i) => ({ start: i, len: 0, ender: null, complete: false, counts: {} });
    let hand = newHand(0), run = newRun(0), sr = newSR(0);

      '<p class="mut tiny">On-axis = a die lands on Top, Front, Bottom or Back (the faces that rotate into each other when the die pitches end-over-end). Left/Right faces are off-axis.</p></div></details>';

    // groups
    h += '<details><summary>Bet groups & GSR</summary><div><table><tr><th>Group</th><th>Hits</th><th>%</th><th>Exp %</th><th>GSR</th><th>Exp GSR</th></tr>' +
      S.groups.map(g => '<tr><td>' + g.name + '</td><td>' + g.count + '</td><td>' + pct(g.pct) + '</td><td>' + pct(g.expPct) + '</td><td class="' + (g.gsr != null && g.gsr > g.expGsr ? 'ok' : '') + '">' + f1(g.gsr, 2) + '</td><td>' + f1(g.expGsr, 2) + '</td></tr>').join('') +
      '</table><p class="mut tiny">GSR = group hits per seven. Across (box numbers) GSR is the Bone Tracker “BSR”; fair dice give 4.00.</p></div></details>';

    h += '<details><summary>Hardways</summary><div><table><tr><th>Bet</th><th>Hits</th><th>%</th><th>Exp %</th></tr>' +
      S.hard.map(x => '<tr><td>' + x.name + '</td><td>' + x.count + '</td><td>' + pct(x.pct) + '</td><td>' + pct(x.expPct) + '</td></tr>').join('') + '</table></div></details>';

    // RBS
    const R = S.rbs, hmax = Math.max(1, ...R.hist, ...R.hist.map((_, k) => R.total * (k < 20 ? (1 / 6) * Math.pow(5 / 6, k) : Math.pow(5 / 6, 20))));
    h += '<details><summary>Rolls between sevens</summary><div>' +
      '<div style="display:flex;gap:2px;align-items:flex-end;height:90px;margin:4px 0">' +
      R.hist.map((c, k) => { const e = R.total * (k < 20 ? (1 / 6) * Math.pow(5 / 6, k) : Math.pow(5 / 6, 20)); return '<div style="flex:1;position:relative;height:100%"><div style="position:absolute;bottom:0;left:0;right:0;height:' + (c / hmax * 100) + '%;background:var(--acc2);border-radius:3px 3px 0 0"></div><div style="position:absolute;left:0;right:0;bottom:' + (e / hmax * 100) + '%;height:2px;background:var(--acc)"></div></div>'; }).join('') + '</div>' +
      '<div class="row mut tiny"><span>0</span><span class="sp" style="text-align:center">rolls before the 7</span><span>20+</span></div>' +
      '<table style="margin-top:6px"><tr><th>Group</th><th>Count</th><th>Cum %</th><th>Random cum %</th></tr>' +
      R.cum.map((c, i) => '<tr><td>' + c.label + '</td><td>' + c.count + '</td><td>' + pct(c.pct) + '</td><td>' + pct(c.rand) + '</td></tr>').join('') + '</table>' +
      '<h3 style="margin-top:12px">Box & crap numbers between sevens</h3><table><tr><th>#</th><th>Avg</th><th>Most</th></tr>' +
      [...DT.BOX, ...DT.CRAP_NUMS].map(t => '<tr><td>' + t + '</td><td>' + f1(R.between[t].avg, 2) + '</td><td>' + (R.between[t].most == null ? '—' : R.between[t].most) + '</td></tr>').join('') + '</table>' +
      '<p class="mut tiny">Green bars = your counts, yellow ticks = fair-dice expectation. Counted from the start of a session (or a manual new hand) to each 7.</p></div></details>';

    // faces / POI / chi
    const ft = (rows) => '<table><tr><th>Face</th><th>Count</th><th>%</th></tr>' + rows.map(f => '<tr><td>' + f.pos + '</td><td>' + f.count + '</td><td class="' + (f.pct > 1 / 6 + 0.02 ? 'up' : f.pct < 1 / 6 - 0.02 ? 'dn' : '') + '">' + pct(f.pct) + '</td></tr>').join('') + '</table>';
    const e36 = S.n / 36;
    h += '<details><summary>Face appearance & landing pairs</summary><div>' +
      '<div class="grid2"><div><h3>Left die</h3>' + ft(S.faces.left) + '</div><div><h3>Right die</h3>' + ft(S.faces.right) + '</div></div><p class="mut tiny">Fair dice: each face 16.7%.</p>' +
      '<h3 style="margin-top:12px">Most / least frequent landing pairs (left-right)</h3><table><tr><th>Pair</th><th>Count</th><th>Expected</th></tr>' +
      S.poi.slice(0, 5).map(x => '<tr><td>' + x.poi + '</td><td>' + x.count + '</td><td>' + f1(e36) + '</td></tr>').join('') + '<tr><td colspan="3" class="mut" style="text-align:center">…</td></tr>' +
      S.poi.slice(-5).map(x => '<tr><td>' + x.poi + '</td><td>' + x.count + '</td><td>' + f1(e36) + '</td></tr>').join('') + '</table>' +
      '<h3 style="margin-top:12px">Dice-value grid (left rows × right columns)</h3><div class="heat"><div class="h"></div>' + [1, 2, 3, 4, 5, 6].map(v => '<div class="h">' + v + '</div>').join('') +
      S.grid.map((row, i) => '<div class="h">' + (i + 1) + '</div>' + row.map(c => { const mx = Math.max(1, ...S.grid.flat()); return '<div style="background:rgba(61,220,151,' + (0.08 + 0.7 * c / mx).toFixed(2) + ')">' + c + '</div>'; }).join('')).join('') + '</div>' +
      '<h3 style="margin-top:12px">Chi-squared on the 36 landing pairs</h3>' +
      (S.chi.ok ? '<p>χ² = ' + f1(S.chi.x2, 1) + ' (df 35), p = ' + S.chi.p.toFixed(3) + ' — <b>' + (S.chi.p < 0.05 ? 'unlikely under random landings' : S.chi.p < 0.15 ? 'a slight tilt, not conclusive' : 'consistent with random landings') + '</b>.</p>' : '<p class="mut">Needs at least ' + S.chi.need + ' rolls (so each of the 36 cells expects ≥5). You have ' + S.n + '.</p>') +
      '<p class="mut tiny">A single p-value from one data set is weak evidence — checking many stats on a small sample will flag something by chance. Re-test on a fresh set of rolls before reading anything into it.</p></div></details>';
    return h;
  }

  /* ================= screens ================= */
  function startHTML() {
    if (!st.sets.length) {
      return '<h1>Track</h1><div class="card"><h3>First, add your dice set</h3><p class="mut">A set is the face pattern of your two dice as you hold them to throw (Top / Facing you / Left on each die). Everything — on-axis, primary and pitch stats — is measured against it.</p>' +
        '<div class="row wrap"><button class="pri" data-act="newSet">Add my dice set</button><button data-act="addSample">Use the workbook sample set</button></div></div>';
    }
    if (!st.startSetId || !st.sets.find(x => x.id === st.startSetId)) st.startSetId = st.sets[0].id;
    const canLive = !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    const mode = st.settings.mode === 'live' && canLive ? 'live' : 'review';
    return '<h1>Track</h1><div class="card"><h3>New session</h3>' +
      '<label>Dice set</label><select id="startSet" data-chg="pickStartSet">' + st.sets.map(x => '<option value="' + x.id + '"' + (x.id === st.startSetId ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select>' +
      '<label>Notes (venue, table, who’s throwing)</label><input id="startNotes" placeholder="e.g. Home practice · felt table">' +
      '<label>How do you capture the rolls?</label><div class="row"><button class="sp' + (mode === 'review' ? ' pri' : '') + '" data-act="setMode" data-m="review">Film first, log after</button><button class="sp' + (mode === 'live' ? ' pri' : '') + '" data-act="setMode" data-m="live"' + (canLive ? '' : ' disabled') + '>Live camera</button></div>' +
      '<p class="mut small" style="margin:8px 0 0">' + (mode === 'review' ? 'Film the throws with the iPhone Camera app (or from here). Then pick the video and tap each roll’s dice while it plays — every roll is stamped with the video time, so you can jump back to any throw.' : 'Records through this app while you tap each roll live.') + (canLive ? '' : ' <span class="tiny">(Live camera needs this app opened from a secure web address.)</span>') + '</p>' +
      '<button class="go" style="width:100%;margin-top:12px;min-height:52px;font-size:17px" data-act="startSession">Start session</button>' +
      '<p class="mut tiny" style="margin-top:10px">Many casinos don’t allow filming at tables — check the house rules.</p></div>' +
      '<div class="card"><h3>Your dice sets</h3>' + st.sets.map(x => '<div class="row" style="padding:4px 0"><span class="sp">' + esc(x.name) + '</span><span class="mut small">' + setFacesText(x) + '</span></div>').join('') + '</div>';
  }
  const setFacesText = s => 'L ' + DT.dieFaces(s.left).slice(0, 4).join('·') + ' / R ' + DT.dieFaces(s.right).slice(0, 4).join('·');

  function padHTML(set, which, sel) {
    const faces = DT.dieFaces(set[which]);
    return '<div class="pad">' + [1, 2, 3, 4, 5, 6].map(v => {
      const i = faces.indexOf(v), on = i < 4;
      return '<button class="' + (on ? 'on-ax' : 'off-ax') + (sel === v ? ' sel' : '') + '" data-act="' + (which === 'left' ? 'pickL' : 'pickR') + '" data-v="' + v + '">' + v + '<small>' + DT.POS[i] + '</small></button>';
    }).join('') + '</div>';
  }

  function liveHTML(s) {
    const a = DT.analyze(s.rolls, eo()), S = DT.computeStats([s], eo());
    const li = s.rolls.length ? lastEntered(s) : 0, L = a.live, last = a.ann[li];
    const recOn = !!rec && rec.sid === s.id;
    let h = '<div class="row"><div class="sp"><div style="font-weight:700">' + esc(s.set.name) + '</div><div class="mut small">' + esc(s.notes || fmtDate(s.startedAt)) + '</div></div>' +
      '<button class="sm dng" data-act="endSession">End</button></div>';
    // camera / review video
    if (s.mode === 'review') { h += reviewCardHTML(s); if (st.scan) h += scanHTML(s); }
    else if (recOn) {
      h += '<div class="card" style="padding:8px"><div class="row" style="margin-bottom:6px"><span class="pill bad">● REC <span id="rectime">' + fmtDur((Date.now() - rec.vStart) / 1000) + '</span></span><span class="sp"></span>' +
        '<button class="sm ghost" data-act="toggleCam">' + (st.hideCam ? 'Show preview' : 'Hide preview') + '</button><button class="sm" data-act="stopVideo">Stop video</button></div>' +
        '<div class="cam' + (st.hideCam ? ' hide' : '') + '" id="camslot"></div></div>';
    } else {
      h += '<div class="card row wrap" style="padding:8px 12px"><span class="mut small sp">' + (st.camError ? 'Camera: ' + esc(st.camError) : 'Video is off for this session.') + '</span><button class="sm" data-act="startVideo">● Start video</button></div>';
    }
    // status
    const phase = L.phase === 'point' ? '<span class="pill point">POINT ' + L.point + '</span>' : '<span class="pill come">COME-OUT</span>';
    h += '<div class="card"><div class="row"><div>' + phase + '<div class="mut small" style="margin-top:6px">Hand #' + L.hand.idx + ' · ' + L.hand.rolls + ' roll' + (L.hand.rolls === 1 ? '' : 's') + ' · points made ' + L.hand.made + '</div></div>' +
      '<div class="sp" style="text-align:right"><div class="bigrun">' + L.run.len + '</div><div class="mut small">rolls before the 7</div></div></div>' +
      '<div class="row mut small" style="margin-top:8px"><span class="sp">Last run <b style="color:var(--ink)">' + (S.runs.last == null ? '—' : S.runs.last) + '</b></span><span class="sp">Best run <b style="color:var(--ink)">' + (S.runs.best == null ? '—' : S.runs.best) + '</b></span><span class="sp">Avg run <b style="color:var(--ink)">' + f1(S.runs.mean) + '</b></span><span>Best hand <b style="color:var(--ink)">' + (S.hands.best == null ? '—' : S.hands.best) + '</b></span></div></div>';
    // entry
    if (!st.scan) h += '<div class="card"><div class="row"><h3 class="sp" style="margin:0">Left die' + (st.selL ? ' = ' + st.selL : '') + '</h3><span class="mut tiny">green = on-axis · amber = off-axis</span></div>' + padHTML(s.set, 'left', st.selL) +
      '<h3 style="margin:12px 0 6px">Right die' + (st.selL ? ' — tap to log the roll' : '') + '</h3>' + padHTML(s.set, 'right', null) + '</div>';
    // last roll + actions
    if (last) {
      const lr = s.rolls[li];
      h += '<div class="card"><div class="row"><div class="sp"><span style="font-size:26px;font-weight:800">' + lr.l + ' + ' + lr.r + ' = ' + last.t + '</span> ' +
        (last.tag ? '<span class="pill ' + (last.tag === 'sevenout' ? 'bad' : last.tag === 'made' ? 'good' : last.tag === 'craps' ? 'warn' : '') + '">' + tagText[last.tag] + (last.tag === 'point' ? ' ' + last.t : '') + '</span>' : '') +
        (last.t === 7 && last.tag === 'natural' ? ' <span class="pill bad">RUN ENDS</span>' : '') + (last.hard ? ' <span class="pill">HARD</span>' : '') + '</div></div>' +
        '<div class="chips" style="margin-top:8px">' + a.ann.slice(-16).reverse().map(x => '<div class="chip ' + chipCls(x) + '"><b>' + x.t + '</b>' + s.rolls[x.i].l + '-' + s.rolls[x.i].r + '</div>').join('') + '</div></div>';
    }
    h += '<div class="row wrap"><button class="sp" data-act="undo"' + (s.rolls.length ? '' : ' disabled') + '>↩ Undo last</button><button class="sp' + (s.pendingBreak ? ' pri' : '') + '" data-act="newHand">' + (s.pendingBreak ? 'New hand queued ✓' : '⟲ New hand / dice passed') + '</button></div>';
    h += '<div class="grid4" style="margin-top:10px">' +
      '<div class="tile"><div class="k">Rolls</div><div class="v">' + S.n + '</div></div>' +
      '<div class="tile"><div class="k">Sevens</div><div class="v">' + S.sevens + '</div></div>' +
      '<div class="tile"><div class="k">SRR</div><div class="v">' + f1(S.srr, 1) + '</div></div>' +
      '<div class="tile"><div class="k">On-axis</div><div class="v">' + pct(S.axis.both.pct, 0) + '</div></div></div>';
    return h;
  }

  function sessionRow(s) {
    const S = DT.computeStats([s], eo());
    return '<div class="card tap" data-act="openSession" data-id="' + s.id + '"><div class="row"><div class="sp"><div style="font-weight:700">' + esc(s.name) + (!s.endedAt ? ' <span class="pill good">LIVE</span>' : '') + '</div>' +
      '<div class="mut small">' + fmtDate(s.startedAt) + ' · ' + esc(s.set.name) + (s.notes ? ' · ' + esc(s.notes) : '') + '</div></div>' +
      ((s.clips || []).length ? '<span title="has video">🎥</span>' : '') + '</div>' +
      '<div class="grid4" style="margin-top:8px"><div class="tile"><div class="k">Rolls</div><div class="v" style="font-size:18px">' + S.n + '</div></div><div class="tile"><div class="k">SRR</div><div class="v" style="font-size:18px">' + f1(S.srr, 1) + '</div></div><div class="tile"><div class="k">Avg RBS</div><div class="v" style="font-size:18px">' + f1(S.rbs.mean, 1) + '</div></div><div class="tile"><div class="k">Best hand</div><div class="v" style="font-size:18px">' + (S.hands.best == null ? '—' : S.hands.best) + '</div></div></div></div>';
  }
  function sessionsHTML() {
    if (st.view && st.view.type === 'session') return sessionDetailHTML();
    const list = [...st.sessions].sort((a, b) => b.startedAt - a.startedAt);
    return '<h1>Sessions</h1>' + (list.length ? list.map(sessionRow).join('') : '<div class="empty">No sessions yet. Start one on the Track tab.</div>');
  }
  function sessionDetailHTML() {
    const s = st.sessions.find(x => x.id === st.view.id); if (!s) { st.view = null; return sessionsHTML(); }
    const S = DT.computeStats([s], eo()), a = DT.analyze(s.rolls, eo());
    let h = '<div class="row"><button class="sm" data-act="back">‹ Back</button><span class="sp"></span>' + (!s.endedAt ? '<button class="sm go" data-act="goTrack">Go to live tracking</button>' : '') + '</div>' +
      '<h1 style="margin-top:10px">' + esc(s.name) + '</h1><div class="mut small">' + fmtDate(s.startedAt) + ' · set: ' + esc(s.set.name) + (s.notes ? ' · ' + esc(s.notes) : '') + '</div>';
    // video
    const clips = s.clips || [];
    h += '<div class="card"><div class="row"><h3 class="sp" style="margin:0">Video</h3><label class="btn sm" style="margin:0;display:inline-flex;align-items:center;color:var(--ink)">Attach video…<input type="file" accept="video/*" id="attachVid" data-chg="attachVideo" style="display:none"></label></div>';
    if (clips.length) {
      const ci = st.player && st.player.sid === s.id ? st.player.ci : 0;
      h += (clips.length > 1 ? '<div class="row wrap" style="margin:8px 0">' + clips.map((c, i) => '<button class="sm ' + (i === ci ? 'pri' : '') + '" data-act="selClip" data-i="' + i + '">Clip ' + (i + 1) + '</button>').join('') + '</div>' : '') +
        '<video id="player" class="play" controls playsinline style="margin-top:8px"></video>' +
        '<div class="row wrap" style="margin-top:8px"><span class="mut small sp">' + clips.map((c, i) => 'Clip ' + (i + 1) + ': ' + fmtDur(c.dur || 0) + ' · ' + (c.size / 1048576).toFixed(0) + ' MB').join(' · ') + '</span><button class="sm" data-act="shareClip" data-i="' + ci + '">Save / share</button></div>' +
        (clips[ci] && clips[ci].external && !s.rolls.some(r => r.vt != null) ? '<label>Roll #1 happens at (seconds into this video)</label><input type="number" min="0" step="0.5" value="' + (clips[ci].offset || 0) + '" data-chg="setOffset" data-i="' + ci + '">' : '') +
        (clips.some(c => c.recovered) ? '<p class="warnbox">A clip was cut short when the app was closed; what was recorded is kept.</p>' : '');
    } else h += '<p class="mut small" style="margin-top:8px">No video. Record one during a session, or attach one you filmed with the Camera app.</p>';
    h += '</div>';
    h += '<h2>Stats</h2>' + statsHTML(S);
    // hands
    h += '<details><summary>Hands (' + a.hands.filter(x => x.rolls).length + ')</summary><div><table><tr><th>Hand</th><th>Before 7-out</th><th>Rolls</th><th>Pts set</th><th>Pts made</th><th>End</th></tr>' +
      a.hands.filter(x => x.rolls).map(x => '<tr><td>#' + x.idx + '</td><td><b>' + x.beforeSeven + '</b></td><td>' + x.rolls + '</td><td>' + x.established + '</td><td>' + x.made + '</td><td>' + (x.ended === 'sevenout' ? '7-out' : x.ended === 'break' ? 'new hand' : 'live') + '</td></tr>').join('') + '</table></div></details>';
    h += '<details><summary>Run lengths</summary><div><div class="runbars">' + a.runs.filter(r => r.complete).map(r => '<span class="' + (r.len <= 1 ? 'lo' : r.len >= 10 ? 'hi' : '') + '" title="ended by ' + r.ender + '">' + r.len + (r.ender === 'craps' ? 'c' : '') + '</span>').join('') +
      '</div><p class="mut tiny">Each number = rolls before the run ended (7, or “c” = come-out craps). Red ≤1, green ≥10.</p></div></details>';
    // rolls
    const t0 = s.rolls.length ? s.rolls[0].t : 0;
    h += '<details><summary>Every roll (' + s.rolls.length + ')</summary><div><table><tr><th>#</th><th>L-R</th><th>Tot</th><th>Event</th><th>Hand</th><th>Run</th><th></th></tr>' +
      s.rolls.map((r, i) => { const x = a.ann[i], c = DT.classify(s.set, r.l, r.r); return '<tr class="tap" data-act="editRoll" data-id="' + s.id + '" data-i="' + i + '"><td>' + (i + 1) + '</td><td>' + r.l + '-' + r.r + (c.bothOn ? '' : ' <span class="up">·</span>') + '</td><td><b>' + x.t + '</b></td><td>' + tagText[x.tag] + '</td><td>' + x.hand + '</td><td>' + x.runPos + '</td><td>' +
        (clips.length ? '<button class="sm" data-act="seek" data-id="' + s.id + '" data-i="' + i + '">▶</button>' : '') + '</td></tr>'; }).join('') + '</table><p class="mut tiny">Tap a row to fix or delete a roll. ▶ jumps the video to that roll. “·” marks a roll with a die off-axis.</p></div></details>';
    h += '<div class="row wrap" style="margin-top:14px"><button class="sp" data-act="csvSession" data-id="' + s.id + '">Export CSV</button><button class="sp dng" data-act="delSession" data-id="' + s.id + '">Delete session</button></div>';
    return h;
  }

  function setsHTML() {
    const idx = setIndex();
    let h = '<div class="row"><h1 class="sp">Dice sets</h1><button class="pri sm" data-act="newSet">+ New set</button></div>';
    if (!idx.length) return h + '<div class="empty">No sets yet. Add the face pattern of your dice to start.</div>';
    const rows = idx.map(x => ({ x, S: DT.computeStats(x.sessions, eo()) }));
    h += '<div class="card"><h3>Compare sets</h3><table><tr><th>Set</th><th>Rolls</th><th>SRR</th><th>Avg RBS</th><th>On-axis</th><th>Primary</th></tr>' +
      rows.map(({ x, S }) => '<tr><td>' + esc(x.name) + '</td><td>' + S.n + '</td><td>' + f1(S.srr, 2) + '</td><td>' + f1(S.rbs.mean, 1) + '</td><td>' + (S.n ? pct(S.axis.both.pct, 0) : '—') + '</td><td>' + (S.n ? pct(S.axis.primary.pct, 0) : '—') + '</td></tr>').join('') +
      '</table><p class="mut tiny">Random dice: SRR 6.00 · avg RBS 5.0 · on-axis 44% · primary 11%. Sets with under a few hundred rolls aren’t comparable — the differences you see are mostly noise.</p></div>';
    rows.forEach(({ x, S }) => {
      h += '<div class="card"><div class="row"><div class="sp"><b>' + esc(x.name) + '</b><div class="mut small">' + (x.set.left ? 'Left ' + DT.dieFaces(x.set.left).join(' ') + ' · Right ' + DT.dieFaces(x.set.right).join(' ') : '') + ' <span class="tiny">(Top, Front, Bottom, Back, Left, Right)</span></div><div class="mut small">' + x.sessions.length + ' session' + (x.sessions.length === 1 ? '' : 's') + ' · ' + S.n + ' rolls</div></div></div>' +
        '<div class="row wrap" style="margin-top:8px"><button class="sm" data-act="scopeSet" data-id="' + x.id + '">Full stats</button>' + (st.sets.find(z => z.id === x.id) ? '<button class="sm" data-act="editSet" data-id="' + x.id + '">Edit</button><button class="sm dng" data-act="delSet" data-id="' + x.id + '">Delete</button>' : '') + '</div></div>';
    });
    return h;
  }

  function statsScreenHTML() {
    const idx = setIndex();
    let sessions = st.sessions, label = 'All sessions';
    if (st.statsScope.startsWith('set:')) { const x = idx.find(i => i.id === st.statsScope.slice(4)); sessions = x ? x.sessions : []; label = x ? x.name : ''; }
    else if (st.statsScope.startsWith('ses:')) { const x = st.sessions.find(i => i.id === st.statsScope.slice(4)); sessions = x ? [x] : []; label = x ? x.name : ''; }

      if (!s.rolls.length) { for (const c of s.clips || []) await Store.delClip(c.key); st.sessions = st.sessions.filter(x => x !== s); await Store.del('sessions', s.id); }
      else { s.endedAt = Date.now(); await saveSession(s); }
      st.activeId = null; await saveMeta('activeId', null); st.selL = null;
      if (s.rolls.length) { st.tab = 'sessions'; st.view = { type: 'session', id: s.id }; }
      render();
    },
    openSession(el) { st.view = { type: 'session', id: el.dataset.id }; render(); window.scrollTo(0, 0); },
    back() { st.view = null; render(); },
    goTrack() { st.tab = 'track'; render(); },
    selClip(el) { if (st.player && st.player.url) URL.revokeObjectURL(st.player.url); st.player = { sid: st.view.id, ci: +el.dataset.i, url: null }; render(); },
    async seek(el) {
      const s = st.sessions.find(x => x.id === el.dataset.id), i = +el.dataset.i, r = s.rolls[i];
      let ci = r.cl != null ? r.cl : 0; if (!s.clips[ci]) ci = 0;
      const changed = !st.player || st.player.sid !== s.id || st.player.ci !== ci;
      if (changed) { if (st.player && st.player.url) URL.revokeObjectURL(st.player.url); st.player = { sid: s.id, ci, url: null }; if (s.clips.length > 1) render(); }
      await mountPlayer(rollVideoTime(s, ci, i)); const v = $('#player'); if (v) v.scrollIntoView({ block: 'center', behavior: 'smooth' });
    },
    async shareClip(el) { const s = st.sessions.find(x => x.id === st.view.id), i = +el.dataset.i, c = s.clips[i]; const blob = await clipBlob(s, i); const ext = /mp4/.test(c.mime) ? 'mp4' : /webm/.test(c.mime) ? 'webm' : 'mov'; await saveFile(s.name.replace(/[^\w\-]+/g, '_') + '_clip' + (i + 1) + '.' + ext, blob); },
    async delSession(el) {
      const s = st.sessions.find(x => x.id === el.dataset.id); if (!s) return;
      if (!(await ask('Delete “' + s.name + '” and its video?', 'Delete', true))) return;
      if (rec && rec.sid === s.id) await stopRecording();
      for (const c of s.clips || []) await Store.delClip(c.key);
      await Store.del('sessions', s.id); st.sessions = st.sessions.filter(x => x !== s);
      if (st.activeId === s.id) { st.activeId = null; await saveMeta('activeId', null); wake(false); }
      st.view = null; render();
    },
    csvSession(el) { const s = st.sessions.find(x => x.id === el.dataset.id); saveFile(s.name.replace(/[^\w\-]+/g, '_') + '.csv', new Blob([DT.toCSV([s], eo())], { type: 'text/csv' })); },
    csvAll() { if (!st.sessions.length) return toast('Nothing to export yet'); saveFile('dice-tracker-rolls.csv', new Blob([DT.toCSV([...st.sessions].sort((a, b) => a.startedAt - b.startedAt), eo())], { type: 'text/csv' })); },
    jsonAll() { saveFile('dice-tracker-backup.json', new Blob([JSON.stringify({ app: 'dice-tracker', v: 1, sets: st.sets, sessions: st.sessions, settings: st.settings }, null, 1)], { type: 'application/json' })); },
    async persist() { try { const ok = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; toast(ok ? 'Storage will be kept' : 'Not granted — keep backups'); } catch (e) { toast('Not available here'); } },
    async eraseAll() { if (!(await ask('Erase ALL sets, sessions and videos on this device?', 'Erase everything', true))) return; await stopRecording(); await Store.clear(); st.sets = []; st.sessions = []; st.activeId = null; st.view = null; st.player = null; wake(false); toast('Erased'); render(); },
    scope(el) { st.statsScope = el.value; render(); },
    scopeSet(el) { st.statsScope = 'set:' + el.dataset.id; st.tab = 'stats'; render(); window.scrollTo(0, 0); },
    setting(el) { const k = el.dataset.k; st.settings[k] = el.type === 'checkbox' ? el.checked : el.value; saveMeta('settings', st.settings); if (k === 'wake') wake(el.checked && !!active()); render(); },
    // dice sets
    newSet() { setEditor(null); },
    editSet(el) { setEditor(el.dataset.id); },
    async addSample() { const s = { id: uid(), ...clone(SAMPLE) }; st.sets.push(s); await Store.put('sets', s); st.startSetId = s.id; render(); toast('Sample set added — edit it to match yours'); },
    setPrev() { updateSetPreview(); },
    async saveSet(el) {
      const g = id => +$('#' + id).value;
      const s = { id: el.dataset.id || uid(), name: $('#setName').value.trim(), left: { top: g('lt'), front: g('lf'), left: g('ll') }, right: { top: g('rt'), front: g('rf'), left: g('rl') } };
      const err = DT.validateSet(s); if (err) { $('#setErr').textContent = err; return; }
      const i = st.sets.findIndex(x => x.id === s.id); if (i >= 0) st.sets[i] = s; else st.sets.push(s);
      let saveErr = null;
      try { await Store.put('sets', s); } catch (e) { saveErr = e; }
      closeModal(); render();
      toast(saveErr ? 'Set kept for now, but phone storage failed (' + ((saveErr && saveErr.name) || 'error') + '). Use More → Backup soon.' : 'Set saved');
    },
    async delSet(el) {
      const s = st.sets.find(x => x.id === el.dataset.id); if (!s) return;
      if (!(await ask('Delete the set “' + s.name + '”? Past sessions keep their own copy and stats.', 'Delete', true))) return;
      st.sets = st.sets.filter(x => x !== s); await Store.del('sets', s.id); render();
    },
    // roll editing
    editRoll(el) { const s = st.sessions.find(x => x.id === el.dataset.id), i = +el.dataset.i, r = s.rolls[i]; st.edit = { sid: s.id, i, l: r.l, r: r.r }; rollEditor(); },
    eL(el) { st.edit.l = +el.dataset.v; rollEditor(); },
    eR(el) { st.edit.r = +el.dataset.v; rollEditor(); },
    async eSave() { const s = st.sessions.find(x => x.id === st.edit.sid); const r = s.rolls[st.edit.i]; r.l = st.edit.l; r.r = st.edit.r; await saveSession(s); closeModal(); render(); toast('Roll updated'); },
    async eDel() {
      const s = st.sessions.find(x => x.id === st.edit.sid); const [r] = s.rolls.splice(st.edit.i, 1);
      if (r.brk && s.rolls[st.edit.i]) s.rolls[st.edit.i].brk = true;
      await saveSession(s); closeModal(); render(); toast('Roll deleted');
    },
    async attachVideo(el) {
      const f = el.files && el.files[0]; if (!f) return; const s = st.sessions.find(x => x.id === (el.dataset.sid || (st.view && st.view.id))); if (!s) return;
      const key = s.id + '#' + (s.clips || []).length; await Store.put('chunks', { sid: key, idx: 0, blob: f });
      s.clips = s.clips || []; s.clips.push({ key, mime: f.type || 'video/mp4', startedAt: s.startedAt, chunks: 1, size: f.size, dur: 0, external: true, offset: 0 });
      await saveSession(s); if (st.player && st.player.url) URL.revokeObjectURL(st.player.url); st.player = { sid: s.id, ci: s.clips.length - 1, url: null }; render(); toast(s.mode === 'review' ? 'Video added — press play and log rolls' : 'Video attached — set where roll #1 is'); el.value = '';
    },
    async setOffset(el) { const s = st.sessions.find(x => x.id === st.view.id); s.clips[+el.dataset.i].offset = +el.value || 0; await saveSession(s); toast('Saved'); },
    async importJson(el) {
      const f = el.files && el.files[0]; if (!f) return;
      try { await restoreFrom(JSON.parse(await f.text())); } catch (e) { toast('Could not read that file'); }
    },
    setMode(el) { st.settings.mode = el.dataset.m; saveMeta('settings', st.settings); render(); },
    openScan() { if (!active()) return; revVideo.pause(); st.scan = { step: 'cal', img: null, taps: [], two: false, tol: DV.TOL_DEFAULT, rate: 2, cal: null, blobs: [], msg: '', cands: [] }; render(); },
    scanCancel() { if (st.scan && st.scan.signal) st.scan.signal.cancelled = true; st.scan = null; render(); },
    scanFrame() {
      const v = revVideo, sc = st.scan; if (!sc) return; if (!v.videoWidth) { toast('Wait for the video to load'); return; }
      v.pause(); const w = Math.min(v.videoWidth, 1280), h = Math.round(w * v.videoHeight / v.videoWidth), c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(v, 0, 0, w, h); sc.img = x.getImageData(0, 0, w, h); sc.taps = []; sc.cal = null; sc.blobs = []; sc.msg = ''; render();
    },
    scanTwo(el) { const sc = st.scan; sc.two = el.checked; sc.taps = []; sc.cal = null; sc.blobs = []; sc.msg = ''; render(); },
    scanTol(el) { const sc = st.scan; sc.tol = +el.value; scanRecalc(); render(); },
    scanRate(el) { st.scan.rate = +el.value; },
    async scanRun() {
      const sc = st.scan; if (!sc || !sc.cal) return;
      sc.step = 'run'; sc.signal = { cancelled: false }; sc.cands = []; wake(true); render();
      let out = [];
      try {
        out = await DV.scanVideo(revVideo, sc.cal, {
          rate: sc.rate || 2, interval: .1, signal: sc.signal,
          onProgress: p => { const b = $('#scanbar'); if (b) b.style.width = Math.min(100, p * 100) + '%'; },
          onCandidate: c => { sc.cands.push(c); const t = $('#scancount'); if (t) t.textContent = 'Rolls found: ' + sc.cands.length + ' · now at ' + fmtDur(c.vt); }
        });
      } catch (e) { toast('Scan stopped: ' + ((e && e.message) || 'error')); out = sc.cands; }
      if (!st.settings.wake) wake(false);
      if (st.scan !== sc) return;
      sc.cands = out.map(c => ({ ...c, edited: false })); sc.step = 'res'; revVideo.currentTime = 0; render();
    },
    scanStop() { if (st.scan && st.scan.signal) st.scan.signal.cancelled = true; },
    scanAgain() { st.scan.step = 'cal'; render(); },
    scanEdit(el) { const c = st.scan.cands[+el.dataset.i]; c[el.dataset.w] = el.value ? +el.value : null; c.edited = true; render(); },
    scanDrop(el) { st.scan.cands.splice(+el.dataset.i, 1); render(); },
    scanJump(el) { const c = st.scan.cands[+el.dataset.i]; revVideo.currentTime = Math.max(0, c.vt - 1.5); revVideo.play().catch(() => {}); window.scrollTo(0, 0); },
    async scanAdd() {
      const sc = st.scan, s = active(); if (!sc || !s) return; const ci = curClip(s); let added = 0, skipped = 0; const base = Date.now();
      sc.cands.forEach((c, i) => {
        if (c.l == null || c.r == null) return;
        if (s.rolls.some(r => r.vt != null && (r.cl || 0) === ci && Math.abs(r.vt - c.vt) < 1.2)) { skipped++; return; }
        s.rolls.push({ l: c.l, r: c.r, t: base + i, cl: ci, vt: c.vt, auto: true }); added++;
      });
      if (s.rolls.every(x => x.vt != null)) s.rolls.sort((p, q) => ((p.cl || 0) - (q.cl || 0)) || (p.vt - q.vt) || (p.t - q.t));
      await saveSession(s); st.scan = null; render();
      toast('Added ' + added + ' roll' + (added === 1 ? '' : 's') + (skipped ? ' (' + skipped + ' already logged)' : ''));
    },
    skip(el) { revVideo.currentTime = Math.max(0, revVideo.currentTime + (+el.dataset.d)); },
    playpause() { if (revVideo.paused) revVideo.play().catch(() => {}); else revVideo.pause(); },
    rate(el) { revVideo.playbackRate = +el.dataset.r; render(); },
    selRevClip(el) { const s = active(); if (!s) return; if (st.player && st.player.url) URL.revokeObjectURL(st.player.url); st.player = { sid: s.id, ci: +el.dataset.i, url: null }; revVideo.removeAttribute('data-src'); render(); },
    async copyBackup() { copyText(JSON.stringify({ app: 'dice-tracker', v: 1, sets: st.sets, sessions: st.sessions, settings: st.settings }), 'Backup'); },
    copyCsv() { if (!st.sessions.length) return toast('Nothing to copy yet'); copyText(DT.toCSV([...st.sessions].sort((a, b) => a.startedAt - b.startedAt), eo()), 'CSV'); },
    async pasteRestore() { const t = ($('#restoreText') || {}).value || ''; try { await restoreFrom(JSON.parse(t)); } catch (e) { toast('That isn’t a Dice Tracker backup'); } },
    mOk() { closeModal(); const r = st.askRes; st.askRes = null; if (r) r(true); },
    mClose() { closeModal(); const r = st.askRes; st.askRes = null; if (r) r(false); },
  };

  async function restoreFrom(d) {
    if (!d || d.app !== 'dice-tracker') throw new Error('not a Dice Tracker backup');
    let ns = 0, nx = 0;
    for (const x of d.sets || []) if (!st.sets.find(y => y.id === x.id)) { st.sets.push(x); await Store.put('sets', x); ns++; }
    for (const x of d.sessions || []) if (!st.sessions.find(y => y.id === x.id)) { x.clips = []; st.sessions.push(x); await Store.put('sessions', x); nx++; }
    toast('Restored ' + ns + ' sets, ' + nx + ' sessions'); render();
  }
  async function copyText(text, what) {
    try { await navigator.clipboard.writeText(text); toast(what + ' copied — paste it into Notes or Mail'); return; } catch (e) { /* fall through */ }
    modal('<h3>Copy this ' + esc(what) + '</h3><p class="mut small">Press and hold in the box, Select All, Copy.</p><textarea id="copybox" rows="8" readonly>' + esc(text) + '</textarea><button class="pri" style="width:100%;margin-top:10px" data-act="mClose">Done</button>');
    const t = $('#copybox'); if (t) { t.focus(); t.select(); }
  }
  function rollEditor() {
    const s = st.sessions.find(x => x.id === st.edit.sid);
    modal('<h3>Roll #' + (st.edit.i + 1) + '</h3><label>Left die</label>' + padHTMLEdit(s.set, 'left', st.edit.l, 'eL') + '<label>Right die</label>' + padHTMLEdit(s.set, 'right', st.edit.r, 'eR') +
      '<p class="mut">Total: <b>' + (st.edit.l + st.edit.r) + '</b></p><div class="row wrap"><button class="sp ghost" data-act="mClose">Cancel</button><button class="sp dng" data-act="eDel">Delete roll</button><button class="sp pri" data-act="eSave">Save</button></div>');
  }
  function padHTMLEdit(set, which, sel, act) {
    const faces = DT.dieFaces(set[which]);
    return '<div class="pad">' + [1, 2, 3, 4, 5, 6].map(v => { const i = faces.indexOf(v); return '<button class="' + (i < 4 ? 'on-ax' : 'off-ax') + (sel === v ? ' sel' : '') + '" data-act="' + act + '" data-v="' + v + '">' + v + '<small>' + DT.POS[i] + '</small></button>'; }).join('') + '</div>';
  }
  function setEditor(id) {
    const cur = id ? st.sets.find(x => x.id === id) : { name: '', left: SAMPLE.left, right: SAMPLE.right };
    const sel = (i, v) => '<select id="' + i + '" data-chg="setPrev">' + [1, 2, 3, 4, 5, 6].map(n => '<option' + (n === v ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>';
    const die = (p, d, title) => '<h3 style="margin-top:14px">' + title + '</h3><div class="grid3"><div><label>Top</label>' + sel(p + 't', d.top) + '</div><div><label>Facing you</label>' + sel(p + 'f', d.front) + '</div><div><label>Left side</label>' + sel(p + 'l', d.left) + '</div></div><div class="mut small" id="' + p + 'prev" style="margin-top:6px"></div>';
    modal('<h3>' + (id ? 'Edit dice set' : 'New dice set') + '</h3><label>Name</label><input id="setName" value="' + esc(cur.name) + '" placeholder="e.g. 3V set #1 / red-blue">' +
      '<p class="mut small" style="margin:10px 0 0">Hold the pair the way you throw it. For each die read the number on top, the number facing you, and the number on its left side — the opposite faces fill in automatically. The left die is whichever one you always treat as “left” (colored or marked dice help).</p>' +
      die('l', cur.left, 'Left die') + die('r', cur.right, 'Right die') +
      '<div id="setErr" class="badc small" style="margin-top:8px;min-height:18px"></div><div class="row" style="margin-top:6px"><button class="sp ghost" data-act="mClose">Cancel</button><button class="sp pri" data-act="saveSet" data-id="' + (id || '') + '">Save set</button></div>');
    updateSetPreview();
  }
  function updateSetPreview() {
    ['l', 'r'].forEach(p => {
      const d = { top: +$('#' + p + 't').value, front: +$('#' + p + 'f').value, left: +$('#' + p + 'l').value }; const err = DT.validateDie(d);
      $('#' + p + 'prev').innerHTML = err ? '<span class="badc">' + esc(err) + '</span>' : 'Top ' + d.top + ' · Front ' + d.front + ' · Bottom ' + (7 - d.top) + ' · Back ' + (7 - d.front) + ' · Left ' + d.left + ' · Right ' + (7 - d.left);
    });
  }

  /* ================= events & boot ================= */
  window.addEventListener('unhandledrejection', e => { try { toast('Something went wrong: ' + ((e.reason && (e.reason.message || e.reason.name)) || e.reason)); } catch (_) {} });
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); } });
  document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && A[el.dataset.chg]) A[el.dataset.chg](el, e); });

  async function boot() {
    await Store.open();
    try {
      st.sets = await Store.all('sets'); st.sessions = await Store.all('sessions');
      const meta = await Store.all('meta'); meta.forEach(m => { if (m.key === 'settings') st.settings = { ...DEFAULTS, ...m.value }; if (m.key === 'activeId') st.activeId = m.value; });
      await recoverClips();
    } catch (e) { /* start empty */ }
    if (st.activeId && !st.sessions.find(s => s.id === st.activeId && !s.endedAt)) st.activeId = null;
    if (st.activeId && st.settings.wake) wake(true);
    render();
  }
  window.__dt = { st, A, Store, render }; // handy for debugging / tests
  boot();
})();

</script>

</body>
